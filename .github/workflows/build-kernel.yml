name: Build Redmi K20 (davinci) Kernel

on:
  workflow_dispatch:
    inputs:
      sukisu_nova_ref:
        description: 'SukiSU-Nova branch, tag, or commit'
        required: false
        default: 'builtin-new'
      enable_sukisu_nova:
        description: 'Enable SukiSU-Nova'
        required: false
        type: boolean
        default: true
      enable_droidspaces:
        description: 'Enable Droidspaces'
        required: false
        type: boolean
        default: true
      create_release:
        description: 'Publish release'
        required: false
        type: boolean
        default: true
  push:
    branches:
      - main
      - phoenix-r-oss
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libncurses5 libncurses-dev \
            zip openjdk-11-jre-headless abootimg curl wget git python2 python3
          if [ ! -f /usr/bin/python ]; then
            sudo ln -sf /usr/bin/python2 /usr/bin/python
          fi

      - name: Setup toolchains
        run: |
          git clone --depth=1 https://github.com/sticpaper/Snapdragon-LLVM-ARM-Compiler-10.0.7-for-Android-NDK.git $GITHUB_WORKSPACE/clang
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git $GITHUB_WORKSPACE/gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git $GITHUB_WORKSPACE/gcc32
          echo "$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin" >> $GITHUB_PATH

      - name: Configure
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          ENABLE_SUKISU="${{ github.event.inputs.enable_sukisu_nova || 'true' }}"
          ENABLE_DROIDSPACES="${{ github.event.inputs.enable_droidspaces || 'true' }}"
          SUKISU_REF="${{ github.event.inputs.sukisu_nova_ref || 'builtin-new' }}"

          echo "ENABLE_SUKISU=$ENABLE_SUKISU" >> $GITHUB_ENV
          echo "ENABLE_DROIDSPACES=$ENABLE_DROIDSPACES" >> $GITHUB_ENV

          SUFFIX="davinci"
          if [ "$ENABLE_SUKISU" = "true" ]; then
            SUFFIX="${SUFFIX}-sukisu-nova"
          fi
          if [ "$ENABLE_DROIDSPACES" = "true" ]; then
            SUFFIX="${SUFFIX}-droidspaces"
          fi
          echo "BUILD_SUFFIX=$SUFFIX" >> $GITHUB_ENV

          if [ "$ENABLE_SUKISU" = "true" ]; then
            git clone --depth=1 -b "$SUKISU_REF" https://github.com/SukiSU-Nova/SukiSU-Nova.git KernelSU || {
              git clone https://github.com/SukiSU-Nova/SukiSU-Nova.git KernelSU
              git -C KernelSU checkout "$SUKISU_REF"
            }

            rm -rf drivers/kernelsu
            ln -sf ../KernelSU/kernel drivers/kernelsu
          fi

          MAKE_ARGS="ARCH=arm64 SUBARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi-"
          echo "MAKE_ARGS=$MAKE_ARGS" >> $GITHUB_ENV

          make $MAKE_ARGS vendor/davinci_user_defconfig

          if [ "$ENABLE_DROIDSPACES" = "true" ]; then
            cat arch/arm64/configs/droidspaces.config >> .config
            make $MAKE_ARGS olddefconfig
          fi

          if [ "$ENABLE_SUKISU" = "true" ]; then
            cat arch/arm64/configs/sukisu_nova.config >> .config
            make $MAKE_ARGS olddefconfig
          else
            sed -i '/CONFIG_KSU/d' .config
            echo "# CONFIG_KSU is not set" >> .config
            make $MAKE_ARGS olddefconfig
          fi

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          make $MAKE_ARGS -j$(nproc) Image.gz
          cat arch/arm64/boot/Image.gz tools/orig_dtbs.bin > arch/arm64/boot/Image.gz-dtb

      - name: Fetch manager
        if: ${{ env.ENABLE_SUKISU == 'true' }}
        run: |
          python3 tools/fetch_sukisu_nova_manager.py dist

      - name: Package
        run: |
          mkdir -p dist
          chmod +x tools/pack_ak3.sh tools/pack_signed_boot.sh
          tools/pack_ak3.sh arch/arm64/boot/Image.gz-dtb "dist/AnyKernel3-${BUILD_SUFFIX}.zip"
          tools/pack_signed_boot.sh arch/arm64/boot/Image.gz-dtb "dist/boot.img"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.BUILD_SUFFIX }}
          path: dist/*
          retention-days: 14

      - name: Release
        if: ${{ github.event.inputs.create_release != 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ github.run_number }}-${{ env.BUILD_SUFFIX }}"
          tag_name: "v${{ github.run_number }}-${{ env.BUILD_SUFFIX }}"
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
